name: KBase CDM Task Service tests

on:
  pull_request:
    types:
    - opened
    - reopened
    - synchronize
    - ready_for_review
  push:
    # run workflow when merging to main or develop
    branches:
      - main
      - master
      - develop

jobs:

  task_service_tests:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - python-version: "3.12.13"
            mongo: "mongodb-linux-x86_64-ubuntu2204-7.0.18"
            minio: "2025-02-07T23-21-09Z"  # minimum supported version
            minio_sha256: "5a1b5bc661f0b8fd55eee530ea472205e77624718e31f7b4402bc269299501d5"
            mc: "2024-08-13T05-33-17Z"
            mc_sha256: "279825b9b3761e6f39f931bb4984d3bbf664af5510cdbe3dea2a3c9e4b518e19"

    steps:
    
    - name: Repo checkout
      uses: actions/checkout@v6
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@v7

    - name: Install dependencies and set up test config
      shell: bash
      run: |
        export CRANE_VER=v0.21.2
        export HOMEDIR=`pwd`
        
        # set up python dependencies
        export UV_PROJECT_ENVIRONMENT="${pythonLocation}"
        uv sync --locked

        # move to parent dir of homedir to install binaries etc
        cd ..

        # set up crane
        # don't bother to verify provenance here
        curl -sL -f --retry 5 --retry-all-errors --retry-connrefused \
          "https://github.com/google/go-containerregistry/releases/download/$CRANE_VER/go-containerregistry_Linux_x86_64.tar.gz" \
          > go-containerregistry.tar.gz
        tar -zxf go-containerregistry.tar.gz
        export CRANE_EXE_PATH=`pwd`/crane
        
        # set up Mongo
        wget -q http://fastdl.mongodb.org/linux/${{matrix.mongo}}.tgz
        tar xfz ${{matrix.mongo}}.tgz
        export MONGOD=`pwd`/${{matrix.mongo}}/bin/mongod
        
        # set up Minio
        # dl.minio.io no longer serves open-source Minio/mc releases; pull from GitHub releases instead
        curl -sL -f --retry 5 --retry-all-errors --retry-connrefused \
          "https://github.com/minio/minio/releases/download/RELEASE.${{matrix.minio}}/minio.linux-amd64.RELEASE.${{matrix.minio}}" \
          -o minio
        echo "${{matrix.minio_sha256}}  minio" | sha256sum -c -
        chmod a+x minio
        export MINIOD=`pwd`/minio

        curl -sL -f --retry 5 --retry-all-errors --retry-connrefused \
          "https://github.com/minio/mc/releases/download/RELEASE.${{matrix.mc}}/mc.linux-amd64.RELEASE.${{matrix.mc}}" \
          -o mc
        echo "${{matrix.mc_sha256}}  mc" | sha256sum -c -
        chmod a+x mc
        export MINIO_MC=`pwd`/mc
        
        # set up test config
        cd $HOMEDIR
        cp test.cfg.example test.cfg
        sed -i "s#^test.crane.exe=.*#test.crane.exe=$CRANE_EXE_PATH#" test.cfg
        sed -i "s#^test.mongo.exe=.*#test.mongo.exe=$MONGOD#" test.cfg
        sed -i "s#^test.minio.exe=.*#test.minio.exe=$MINIOD#" test.cfg
        sed -i "s#^test.minio.mc.exe=.*#test.minio.mc.exe=$MINIO_MC#" test.cfg
        cat test.cfg

    - name: Run tests
      shell: bash
      run: PYTHONPATH=. pytest --cov=cdmtaskservice --cov-report=xml test

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v6
      with:
        use_pypi: true
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: true
