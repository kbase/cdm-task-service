[project]
name = "cdm-task-service"
version = "0.1.0"
description = "CDM Task Service"
readme = "README.md"
# Note - need to be flexible on the patch version here since the HTCondor workers may have
# various versions of pip / uv
requires-python = ">=3.14,<3.15"

dependencies = [
    "aiobotocore==3.9.2",
    "aiofiles==25.1.0",
    "aiohttp==3.14.3",
    "aiohttp-socks==0.12.0",
    "aiokafka==0.14.0",
    "apscheduler==3.11.3",
    "async-lru==2.3.0",
    "awscrt==0.37.0",
    "bidict==0.24.1",
    "cacheout==0.16.0",
    "docker==7.2.0",
    "docker-image-py==0.2.0",
    "fastapi[standard]==0.142.2",
    # stay on htcondor 25.0.X - LTS version
    "htcondor==25.14.1",
    "jinja-cli==1.2.2",
    "jsonref==1.1.0",
    "kbase-auth-client==0.1.2",
    "marisa-trie==1.4.1",
    "motor==3.7.1",
    "python-json-logger==4.2.0",
    "requests==2.34.2",
    "semver==3.1.0",
    "sfapi-client==0.6.0",
    "uvicorn[standard]==0.54.0",
    "yarl==1.25.1",
]

[dependency-groups]
dev = [
    # aiobotocore 3.9.2 cannot be installed with boto3 > 1.43.106
    "boto3==1.43.106",
    "ipython==9.17.1",
    "kafka-python==3.0.11",
    "pymongo==4.18.2",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.uv]
environments = ["sys_platform == 'linux'"]
